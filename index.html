<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Ruth 🌻</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--m:#ffefb8;--r:#fadbd3;--c:#4a2b3d;--s:#8a6273;--d:#e8a317}*{box-sizing:border-box}html,body{height:100%;margin:0}body{min-height:100svh;overflow:hidden;color:var(--c);font-family:Karla,system-ui,sans-serif;background:linear-gradient(175deg,var(--m),var(--r));position:relative}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 30%,#fff9de,transparent 70%);z-index:-1}#escenario{height:100%;display:grid;place-items:center;padding:2rem 1.6rem;text-align:center;cursor:pointer}.mensaje{max-width:30rem;margin:0;font:italic 400 clamp(1.35rem,4.6vw,2rem)/1.5 Fraunces,Georgia,serif;opacity:0;transform:translateY(14px);transition:.9s}.mensaje.activo{opacity:1;transform:none}.fuerte{font-style:normal;font-weight:500;color:var(--d)}#pista{position:fixed;bottom:calc(1.6rem + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--s);font-size:.85rem;opacity:.7;pointer-events:none}#puntos{position:fixed;top:calc(1.4rem + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:.4rem;pointer-events:none}#puntos span{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.18;transition:.5s}#puntos .visto{opacity:.65}#puntos .actual{opacity:1;transform:scale(1.35)}#final{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.6rem;opacity:0;pointer-events:none;transition:opacity 1.5s}#final.visible{opacity:1;pointer-events:auto}#ramo{width:clamp(230px,62vw,340px);margin-bottom:.2rem;filter:drop-shadow(0 18px 22px #aa690f40);opacity:0;transform:translateY(14px) scale(.92);transition:1.1s}#final.visible #ramo{opacity:1;transform:none;transition-delay:.1s}h1{margin:0 0 .5em;font:italic 400 clamp(2.2rem,7.4vw,3.6rem)/1.08 Fraunces,Georgia,serif;opacity:0;transform:translateY(10px);transition:1.1s}#final.visible h1{opacity:1;transform:none;transition-delay:.55s}#final p{max-width:28rem;margin:0;color:var(--s);font-size:clamp(1rem,2.8vw,1.15rem);line-height:1.65;opacity:0;transform:translateY(10px);transition:1.1s}#final.visible p{opacity:1;transform:none;transition-delay:1.05s}.firma{margin-top:1.4em!important;font:italic 1.1rem Fraunces,Georgia,serif;color:var(--c)!important}#final.visible .firma{opacity:1;transform:none;transition-delay:1.45s}#campo{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:6}.flor{position:absolute;top:0;will-change:transform,opacity}@media(prefers-reduced-motion:reduce){*{transition-duration:.2s!important}}
</style></head>
<body><div id="puntos" aria-hidden="true"></div><main id="escenario"><p id="texto" class="mensaje"></p></main><p id="pista">toca la pantalla para continuar</p>
<section id="final" aria-hidden="true"><svg id="ramo" viewBox="0 0 320 300" role="img" aria-label="Ramo de flores amarillas"><defs><radialGradient id="g"><stop stop-color="#3b2314"/><stop offset="1" stop-color="#6b4a22"/></radialGradient></defs><g fill="#6e9a48"><path d="M160 270C120 250 90 225 70 190c40 5 70 25 90 55z"/><path d="M160 270c40-20 70-45 90-80-40 5-70 25-90 55z"/></g><g stroke="#5c7a3a" stroke-width="5" stroke-linecap="round"><path d="m160 272-65-114M160 272l-30-122M160 272V140M160 272l30-122M160 272l65-114"/></g><path d="M118 250q42-18 84 0l-10 20q-32-13-64 0z" fill="#d97757"/><g fill="#f8c22a">${''}</g><g fill="#fac933">${''}</g><g fill="#fac933"><ellipse cx="160" cy="73" rx="13" ry="37"/><ellipse cx="160" cy="73" rx="13" ry="37" transform="rotate(30 160 110)"/><ellipse cx="160" cy="73" rx="13" ry="37" transform="rotate(60 160 110)"/><ellipse cx="160" cy="73" rx="13" ry="37" transform="rotate(90 160 110)"/><ellipse cx="160" cy="73" rx="13" ry="37" transform="rotate(120 160 110)"/><ellipse cx="160" cy="73" rx="13" ry="37" transform="rotate(150 160 110)"/></g><circle cx="160" cy="110" r="18" fill="url(#g)"/><g fill="#f6c445"><circle cx="95" cy="158" r="25"/><circle cx="225" cy="158" r="25"/></g><g fill="#5c3b1e"><circle cx="95" cy="158" r="13"/><circle cx="225" cy="158" r="13"/></g></svg><h1>Para ti, mi Ruth</h1><p>Agradezco a todo lo que me llevó a ti y te trajo a mí.</p><p class="firma">Con todo mi cariño,<br>Adrianote :)</p></section><div id="campo"></div>
<script>
(()=>{const msgs=['es la primera vez que hago algo así, pero justamente te tocó alguien que le gusta la programación :b','sé que hoy es el día de las flores amarillas, y sé que este detalle tampoco pueda llegar a impresionarte, pero me dijiste que era difícil que hoy salgas y lo entiendo mi amor, <b>TE AMO DEMASIADO RUTH</b>. tampoco quería hacer el típico video dedicatoria que manda todo el mundo, quería hacer algo nuevo y diferente que ojalá te guste, mi amor','quiero que sepas que en el poco tiempo que llevamos conociéndonos eres la chica más hermosa y tierna que Dios me ha mandado, eres perfecta en todos los sentidos mi amor, aún con tus arranques de locura me encantas mucho :)','quiero que sepas que siempre voy a estar para ti en todo, y espero que siempre me consideres para eso, preciosa. no me importa si estás enferma, despeinada o lo que sea mi amor, me encantas así de preciosa como eres','quiero que me perdones por haber llegado tarde a ti, pero quiero que sepas que no me quiero ir. quiero hacer todas las cosas bien contigo, mi yu <3','pero ahora sí, desde lejitos te mando estas flores, mi amor'];let i=-1,done=false;const t=document.querySelector('#texto'),scene=document.querySelector('#escenario'),hint=document.querySelector('#pista'),dots=document.querySelector('#puntos');msgs.forEach(()=>dots.appendChild(document.createElement('span')));function show(n){t.classList.remove('activo');setTimeout(()=>{t.innerHTML=msgs[n];[...dots.children].forEach((x,j)=>x.className=j<n?'visto':j===n?'actual':'');requestAnimationFrame(()=>t.classList.add('activo'))},n?420:0)}function next(){if(done)return;if(i<msgs.length-1){show(++i);if(i===0)hint.style.display='block'}else{done=true;scene.style.opacity=0;hint.style.opacity=0;setTimeout(()=>{scene.style.display='none';hint.style.display='none';document.querySelector('#final').classList.add('visible');rain()},900)}}scene.onclick=next;show(0);function rain(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;setInterval(()=>{const f=document.createElement('div');f.className='flor';f.textContent=Math.random()<.5?'🌻':'🌼';f.style.cssText=`left:${Math.random()*100}%;font-size:${20+Math.random()*22}px;animation:fall ${6+Math.random()*5}s linear forwards`;document.querySelector('#campo').append(f);setTimeout(()=>f.remove(),12000)},420)}})();
const s=document.createElement('style');s.textContent='@keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(110vh) rotate(360deg);opacity:0}}';document.head.append(s);
</script></body></html>
